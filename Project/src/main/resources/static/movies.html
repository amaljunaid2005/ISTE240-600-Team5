<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<!-- Search -->
<input type="text" id="searchInput" class="form-control mb-3" placeholder="Search by movie name">

<!-- Add Button -->
<button class="btn btn-primary mb-3" id="addBtn">Add New Movie</button>

<!-- Table -->
<table class="table table-bordered table-hover">
  <thead class="table-dark">
  <tr>
      <th>ID</th>
      <th>Movie Name</th>
      <th>Year of Release</th>
      <th>Director</th>
      <th>Lead Actor</th>
      <th>Genre</th>
      <th>Description</th>
  </tr>
  </thead>
  <tbody id="movieTable"></tbody>
</table>
<!-- Form -->
<div id="movieForm" class="card p-3" style="display:none;">
    <input type="hidden" id="movieId">

    <input class="form-control mb-2" id="movieName" placeholder="Movie Name">
    <input class="form-control mb-2" id="yearOfRelease" placeholder="Year of Release">
    <input class="form-control mb-2" id="director" placeholder="Director">
    <input class="form-control mb-2" id="leadActor" placeholder="Lead Actor">
    <input class="form-control mb-2" id="genre" placeholder="Genre">
    <input class="form-control mb-2" id="description" placeholder="description">

    <button class="btn btn-success" id="saveBtn">Save</button>
    <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
</div>
<script>
    const API_URL = "http://localhost:8080/api/movies";

    //function for loading rows into table
    function loadMovies(){
        $.get(API_URL,function(data){
            let records="";
            data.forEach(movie => {
                rows+=`
                <tr>
                <td>${movie.id}</td>
                <td>${movie.movieName}</td>
                <td>${movie.yearOfRelease}</td>
                <td>${movie.director}</td>
                <td>${movie.leadActor}</td>
                <td>${movie.genre}</td>
                <td>${movie.description}</td>
                <td>
                    <button class="btn btn-warning btn-sm editBtn" data-id="${movie.id}">Edit</button>
                    <button class="btn btn-danger btn-sm deleteBtn" data-id="${movie.id}">Delete</button>
                </td>
                </tr>
                `;
            });
            $("#movieTable").html(rows);
        });
    }

    // Deleting a record
    $(document).on("click", ".deleteBtn", function() {
        let id = $(this).data("id");

        $.ajax({
            url: `${API_URL}/${id}`,
            type: "DELETE",
            success: function() {
                loadMovies();
            }
        });
    });
    // Editing a record button
    $(document).on("click", ".editBtn", function() {
        let id = $(this).data("id");

        $.get(`${API_URL}/${id}`, function(movie) {
            $("#movieId").val(movie.id);
            $("#yearOfRelease").val(movie.yearOfRelease);
            $("#director").val(movie.director);
            $("#leadActor").val(movie.leadActor);
            $("#genre").val(movie.genre);
            $("#description").val(movie.description);


            $("#movieForm").show();
        });
    });
    // Searching using movie name
    $("#searchInput").on("input", function() {
        let query = $(this).val();

        if (query === "") {
            loadMovies();
            return;
        }

        $.get(`${API_URL}/search?name=${query}`, function(data) {
            let rows = "";
            data.forEach(movie => {
                rows += `
                <tr>
                <td>${movie.id}</td>
                <td>${movie.movieName}</td>
                <td>${movie.yearOfRelease}</td>
                <td>${movie.director}</td>
                <td>${movie.leadActor}</td>
                <td>${movie.genre}</td>
                <td>${movie.description}</td>
                    <td>
                        <button class="btn btn-warning btn-sm editBtn" data-id="${movie.id}">Edit</button>
                        <button class="btn btn-danger btn-sm deleteBtn" data-id="${movie.id}">Delete</button>
                    </td>
                </tr>
            `;
            });
            $("#movieTable").html(rows);
        });
    });

    //showing form when add button is clicked
    $("#addBtn").click(function (){
        $("#movieId").val("");
        $("#yearOfRelease").val("");
        $("#director").val("");
        $("#leadActor").val("");
        $("#genre").val("");
        $("#description").val("");


        $("#movieForm").show();
    });

    //saving changes when form filled for adding new or updating existing movie
    $("#saveBtn").click(function() {
        let id = $("#movieId").val();

        let movie = {
            movieName: $("#movieName").val(),
            yearOfRelease: $("#yearOfRelease").val(),
            director: $("#director").val(),
            leadActor: $("#leadActor").val(),
            genre: $("#genre").val(),
            description: $("#description").val()
        };

        if (id) {
            //updating existing
            $.ajax({
                url: `${API_URL}/${id}`,
                type: "PUT",
                contentType: "application/json",
                data: JSON.stringify(movie),
                success: function() {
                    loadMovies();
                    $("#movieForm").hide();
                }
            });
        } else {
            //creating new
            $.ajax({
                url: API_URL,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(movie),
                success: function() {
                    loadMovies();
                    $("#movieForm").hide();
                }
            });
        }
    });
    //cancelling form
    $("#cancelBtn").click(function (){
        $("#movieForm").hide();
    });

    //loading table when application starts
    $(document).ready(function (){
        loadMovies();
    });

</script>
</body>
</html>
