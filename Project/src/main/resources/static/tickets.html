<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelTalk - Tickets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<nav class="navbar">
    <div class="nav-content">
        <a href="index.html" class="nav-logo">Reel<span>Talk</span></a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="reviews.html">Reviews</a>
            <a href="users.html">Users</a>
            <a href="tickets.html">Tickets</a>
        </div>
    </div>
</nav>

<div class="page-wrapper">

    <h1 class="page-title">Tickets</h1>
    <p class="page-subtitle">Manage movie bookings</p>

    <div class="red-rule"></div>

    <div class="toolbar">
        <div class="search-wrap">
            <span class="search-icon">&#9906;</span>
            <input type="text" id="searchInput" placeholder="Search by Movie Title">
        </div>

        <button type="button" class="btn-search" id="searchBtn">Search</button>
        <button type="button" class="btn-add" id="addBtn">+ Book Ticket</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>User ID</th>
                <th>Movie ID</th>
                <th>Show Time</th>
                <th>Seat</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="ticketTable">
            <tr>
                <td colspan="7" class="empty-state">No tickets booked yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<div class="modal fade" id="ticketModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Ticket Form</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="ticketId">

                <div class="mb-3">
                    <label>User ID</label>
                    <input type="number" class="form-control" id="userId" placeholder="Enter user ID">
                </div>

                <div class="mb-3">
                    <label>Movie ID</label>
                    <input type="number" class="form-control" id="movieId" placeholder="Enter movie ID">
                </div>

                <div class="mb-3">
                    <label>Show Time</label>
                    <input type="datetime-local" class="form-control" id="showTime">
                </div>

                <div class="mb-3">
                    <label>Seat</label>
                    <input type="text" class="form-control" id="seat" placeholder="A1">
                </div>

            </div>

            <div class="modal-footer d-flex gap-2">
                <button type="button" class="btn-save" id="saveBtn">Save</button>
                <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = "http://localhost:8080/api/tickets";
    let ticketModal;

    function getUserId(t) {
        if (t.user) {
            return t.user.userId || t.user.id || "";
        }
        return "";
    }

    function getMovieId(t) {
        if (t.movie) {
            return t.movie.movieId || t.movie.id || "";
        }
        return "";
    }

    function displayTickets(data) {
        if (!data || data.length === 0) {
            $("#ticketTable").html(`
            <tr>
                <td colspan="7" class="empty-state">No tickets found.</td>
            </tr>
        `);
            return;
        }

        let rows = "";

        data.forEach(function(t) {
            rows += `
        <tr>
            <td>${t.id}</td>
            <td>${getUserId(t)}</td>
            <td>${getMovieId(t)}</td>
            <td>${t.showTime ? new Date(t.showTime).toLocaleString() : ""}</td>
            <td>${t.seat || ""}</td>
            <td>Booked</td>
            <td>
                <button type="button" class="btn btn-sm btn-warning editBtn" data-id="${t.id}">Edit</button>
                <button type="button" class="btn btn-sm btn-danger deleteBtn" data-id="${t.id}">Delete</button>
            </td>
        </tr>
        `;
        });

        $("#ticketTable").html(rows);
    }

    function loadTickets() {
        $.ajax({
            url: API_URL,
            type: "GET",
            success: function(data) {
                displayTickets(data);
            },
            error: function(err) {
                alert("Could not load tickets. Make sure Spring Boot is running.");
                console.log(err);
            }
        });
    }

    $(document).ready(function() {

        ticketModal = new bootstrap.Modal(document.getElementById("ticketModal"));

        loadTickets();

        $("#addBtn").click(function() {
            $("#ticketId").val("");
            $("#userId").val("");
            $("#movieId").val("");
            $("#showTime").val("");
            $("#seat").val("");

            $("#userId").prop("disabled", false);
            $("#movieId").prop("disabled", false);

            ticketModal.show();
        });

        $("#saveBtn").click(function() {
            let id = $("#ticketId").val();

            let userId = parseInt($("#userId").val());
            let movieId = parseInt($("#movieId").val());

            let ticket = {
                showTime: $("#showTime").val(),
                seat: $("#seat").val()
            };

            if (!userId || !movieId || !ticket.showTime || !ticket.seat) {
                alert("All fields are required");
                return;
            }

            if (id) {
                $.ajax({
                    url: `${API_URL}/${id}`,
                    type: "PUT",
                    contentType: "application/json",
                    data: JSON.stringify(ticket),
                    success: function() {
                        loadTickets();
                        ticketModal.hide();
                    },
                    error: function(err) {
                        alert("Update failed");
                        console.log(err);
                    }
                });
            } else {
                $.ajax({
                    url: `${API_URL}?userId=${userId}&movieId=${movieId}`,
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(ticket),
                    success: function() {
                        loadTickets();
                        ticketModal.hide();
                    },
                    error: function(err) {
                        alert("Booking failed. Check if User ID and Movie ID exist.");
                        console.log(err);
                    }
                });
            }
        });

        $("#searchBtn").click(function() {
            let title = $("#searchInput").val().trim();

            if (title === "") {
                loadTickets();
                return;
            }

            $.ajax({
                url: `${API_URL}/search?title=${encodeURIComponent(title)}`,
                type: "GET",
                success: function(data) {
                    displayTickets(data);
                },
                error: function(err) {
                    alert("Search failed");
                    console.log(err);
                }
            });
        });

        $("#searchInput").on("input", function() {
            if ($(this).val().trim() === "") {
                loadTickets();
            }
        });

        $(document).on("click", ".editBtn", function() {
            let id = $(this).data("id");

            $.ajax({
                url: `${API_URL}/${id}`,
                type: "GET",
                success: function(t) {
                    $("#ticketId").val(t.id);
                    $("#userId").val(getUserId(t));
                    $("#movieId").val(getMovieId(t));
                    $("#showTime").val(t.showTime ? t.showTime.substring(0, 16) : "");
                    $("#seat").val(t.seat);

                    $("#userId").prop("disabled", true);
                    $("#movieId").prop("disabled", true);

                    ticketModal.show();
                },
                error: function(err) {
                    alert("Could not load ticket");
                    console.log(err);
                }
            });
        });

        $(document).on("click", ".deleteBtn", function() {
            let id = $(this).data("id");

            $.ajax({
                url: `${API_URL}/${id}`,
                type: "DELETE",
                success: function() {
                    loadTickets();
                },
                error: function(err) {
                    alert("Delete failed");
                    console.log(err);
                }
            });
        });

    });
</script>
</body>
</html>
