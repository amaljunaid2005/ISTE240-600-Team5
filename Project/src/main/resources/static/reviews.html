<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelTalk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

<nav class="navbar">
    <div class="nav-content">
        <a href="/" class="nav-logo">Reel<span>Talk</span></a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/movies.html">Movies</a>
            <a href="/reviews.html">Reviews</a>
            <a href="/users.html">Users</a>
            <a href="/tickets.html">Tickets</a>
        </div>
    </div>
</nav>

<!-- Main -->
<div class="page-wrapper">

    <h1 class="page-title">Reviews</h1>
    <p class="page-subtitle">All entries</p>
    <div class="red-rule"></div>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="search-wrap">
            <span class="search-icon">&#9906;</span>
            <input type="text" id="searchText" placeholder="Search by review text…">
        </div>
        <button class="btn-search" onclick="searchReview()">Search</button>
        <button class="btn-add" onclick="openAddModal()">+ Add Review</button>
    </div>

    <!-- Table -->
    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Review</th>
                <th>Rating</th>
                <th>Date</th>
                <th>User</th>
                <th>Movie</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="reviewTable">
            <tr>
                <td colspan="7" class="empty-state">No reviews yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Review Form</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="reviewId">

                <div>
                    <label for="reviewText">Review</label>
                    <input type="text" id="reviewText" class="form-control" placeholder="Write your review…">
                </div>
                <div>
                    <label for="rating">Rating (1–10)</label>
                    <input type="number" id="rating" class="form-control" placeholder="e.g. 8" min="1" max="10">
                </div>
                <div>
                    <label for="userId">User</label>
                    <select id="userId" class="form-select">
                        <option value="">Select user</option>
                    </select>
                </div>
                <div>
                    <label for="movieId">Movie</label>
                    <select id="movieId" class="form-select">
                        <option value="">Select movie</option>
                    </select>
                </div>
            </div>

            <div class="modal-footer d-flex gap-2">
                <button class="btn-save" onclick="saveReview()">Save</button>
                <button class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
            </div>

        </div>
    </div>
</div>

</body>

<script>
    // Done by Mehrin Fathima - 418006818

    console.log("review.js loaded");
    let modal;

    $(document).ready(function () {
        modal = new bootstrap.Modal(document.getElementById('reviewModal'));
        loadReviews();
        loadUsers();
        loadMovies();
    });

    function loadUsers() {
        $.get("http://localhost:8080/api/users", function(data) {
            let options = `<option value="">Select user</option>`;
            data.forEach(u => {
                options += `<option value="${u.userId}">${u.username}</option>`;
            });
            $("#userId").html(options);
        });
    }

    function loadMovies() {
        $.get("http://localhost:8080/api/movies", function(data) {
            let options = `<option value="">Select movie</option>`;
            data.forEach(m => {
                options += `<option value="${m.id}">${m.movieName}</option>`;
            });
            $("#movieId").html(options);
        });
    }

    function loadReviews() {
        $.get("http://localhost:8080/api/reviews", function (data) {

            let rows = "";

            data.forEach(r => {
                rows += `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.reviewText}</td>
                    <td>${r.rating}</td>
                    <td>${r.reviewDate}</td>
                    <td>${r.userProfile?.id || ""}</td>
                    <td>${r.movie?.id || ""}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editReview(${r.id})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteReview(${r.id})">Delete</button>
                    </td>
                </tr>
            `;
            });

            $("#reviewTable").html(rows);
        });
    }

    function openAddModal() {
        $("#reviewId").val("");
        $("#reviewText").val("");
        $("#rating").val("");
        $("#userId").val("");
        $("#movieId").val("");

        modal.show();
    }

    function saveReview() {

        let reviewId = $("#reviewId").val().trim();
        // Now just check for empty string
        let isEdit = reviewId !== "";

        let rating = parseInt($("#rating").val());
        if (isNaN(rating) || rating < 1 || rating > 10) {
            alert("Rating must be between 1 and 10");
            return;
        }

        let review = {
            reviewText: $("#reviewText").val(),
            rating: rating,
            reviewDate: new Date().toISOString().split("T")[0]
        };

        let userId = $("#userId").val();
        let movieId = $("#movieId").val();

        let url = isEdit
            ? `http://localhost:8080/api/reviews/${reviewId}`
            : `http://localhost:8080/api/reviews?userId=${userId}&movieId=${movieId}`;

        $.ajax({
            url: url,
            type: method,
            contentType: "application/json",
            data: JSON.stringify(review),
            success: function () {
                modal.hide();
                $("#reviewId").val("");  // reset after save too
                loadReviews();
            },
            error: function (xhr) {
                alert("Error: " + xhr.responseText);  // add this to catch silent failures
            }
        });
    }

    function editReview(id) {
        $.get(`http://localhost:8080/api/reviews/${id}`, function (r) {

            $("#reviewId").val(r.id);
            $("#reviewText").val(r.reviewText);
            $("#rating").val(r.rating);
            $("#userId").val(r.userProfile ? r.userProfile.id : "");
            $("#movieId").val(r.movie ? r.movie.id : "");

            modal.show();
        });
    }

    function deleteReview(id) {
        if (confirm("Are you sure?")) {
            $.ajax({
                url: `http://localhost:8080/api/reviews/${id}`,
                type: "DELETE",
                success: function () {
                    loadReviews();
                }
            });
        }
    }

    function searchReview() {
        let text = $("#searchText").val();

        $.get(`http://localhost:8080/api/reviews/search?reviewText=${encodeURIComponent(text)}`, function (data) {

            let rows = "";

            data.forEach(r => {
                rows += `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.reviewText}</td>
                    <td>${r.rating}</td>
                    <td>${r.reviewDate}</td>
                    <td>${r.userProfile?.id || ""}</td>
                    <td>${r.movie?.id || ""}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editReview(${r.id})">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteReview(${r.id})">Delete</button>
                    </td>
                </tr>
            `;
            });

            $("#reviewTable").html(rows);
        });
    }

    function buildRow(r) {
        return `
                <tr>
                    <td><span class="id-chip">${r.id}</span></td>
                    <td class="review-text-cell" title="${r.reviewText}">${r.reviewText}</td>
                    <td><span class="rating-badge">★ ${r.rating}/10</span></td>
                    <td style="color:var(--text-muted);font-size:0.8rem">${r.reviewDate}</td>
                    <td style="color:var(--text-muted)">${r.userProfile?.id || "—"}</td>
                    <td style="color:var(--text-muted)">${r.movie?.id || "—"}</td>
                    <td>
                        <button class="btn-edit" onclick="editReview(${r.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteReview(${r.id})">Delete</button>
                    </td>
                </tr>
            `;
    }

    document.querySelectorAll('.nav-links a').forEach(link => {
        if (link.href === window.location.href) {
            link.classList.add('active');
        }
    });
</script>
</html>
