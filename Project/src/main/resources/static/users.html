<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Name: Madheeha sameen -->

    <meta charset="UTF-8">
    <meta name =  "viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-content">
        <a href="/" class="nav-logo">Reel<span>Talk</span></a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/movies.html">Movies</a>
            <a href="/reviews.html">Reviews</a>
            <a href="/users.html">Users</a>
            <a href="/tickets.html">Tickets</a>
        </div>
    </div>
</nav>

<div class="page-wrapper">

    <h1 class="page-title">Users</h1>
    <p class="page-subtitle">All entries</p>
    <div class="red-rule"></div>

    <div class="toolbar">

        <div class="search-wrap">
            <span class="search-icon">&#9906;</span>

            <input type="text" id="searchInput" placeholder="Search by username">
        </div>

        <button class="btn-add" id="addBtn">Add New User</button>
    </div>

    <div class="table-card">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
            <tr>
                <th>userID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Age</th>
                <th>Bio</th>
                <th>Actions</th>

            </tr>
            </thead>

            <tbody id="userTable"></tbody>
        </table>
    </div>

    //Form
    <div id="userForm" class="modal-content" style="display:none;">

        <input type="hidden" id="userId">

        <div>
            <label for="username">Username</label>
            <input type="text" id="username" class="form-control">
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control">
        </div>

        <div>
            <label for="age">Age</label>
            <input type="number" id="age" class="form-control">
        </div>

        <div>
            <label for="bio">Bio</label>
            <input type="text" id="bio" class="form-control">
        </div>

        <button class="btn btn-success" id="saveBtn">Save</button>
        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
    </div>

</div>


<script>
    const API_URL = "http://localhost:8080/api/UserProfiles";


    // LOAD USERS
    function loadUsers(){
        $.get(API_URL,function(data){
            let rows="";
            data.forEach(user => {
                rows+=`
            <tr>
            <td>${user.userId}</td>
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>${user.age}</td>
            <td>${user.bio}</td>
            <td>
                <button class="btn btn-warning btn-sm editBtn" data-id="${user.userId}">Edit</button>
                <button class="btn btn-danger btn-sm deleteBtn" data-id="${user.userId}">Delete</button>
            </td>
            </tr>
            `;
            });
            $("#userTable").html(rows);
        });
    }


    // DELETE
    $(document).on("click", ".deleteBtn", function() {
        let id = $(this).data("id");

        $.ajax({
            url: `${API_URL}/${id}`,
            type: "DELETE",
            success: function() {
                loadUsers();
            }
        });
    });


    // EDIT
    $(document).on("click", ".editBtn", function() {
        let id = $(this).data("id");

        $.get(`${API_URL}/${id}`, function(user) {

            $("#userId").val(user.userId);
            $("#username").val(user.username);
            $("#email").val(user.email);
            $("#age").val(user.age);
            $("#bio").val(user.bio);

            $("#userForm").show();
        });
    });

    $("#addBtn").click(function() {
    $("#userId").val("");
    $("#username").val("");
    $("#email").val("");
    $("#age").val("");
    $("#bio").val("");

    $("#userForm").show();
});


    // SEARCH
    $("#searchInput").on("input", function() {
        let query = $(this).val();

        if (query === "") {
            loadUsers();
            return;
        }

        $.get(`${API_URL}/search?name=${query}`, function(data) {

            let rows = "";

            data.forEach(user => {
                rows += `
            <tr>
            <td>${user.userId}</td>
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>${user.age}</td>
            <td>${user.bio}</td>
            <td>
                <button class="btn btn-warning btn-sm editBtn" data-id="${user.userId}">Edit</button>
                <button class="btn btn-danger btn-sm deleteBtn" data-id="${user.userId}">Delete</button>
            </td>
            </tr>
            `;
            });

            $("#userTable").html(rows);
        });
    });

    //saving changes when form filled for adding new or updating existing user
    $("#saveBtn").click(function() {
        console.log("Save button clicked");

        let id = $("#userId").val();

        let user = {
            username: $("#username").val(),
            email: $("#email").val(),
            age: ($("#age").val()),
            bio: $("#bio").val()
        };

        if (!user.username) {
            alert("Username is required");
            return;
        }

        if (!user.email) {
            alert("Email is required");
            return;
        }

        if (!user.age || isNaN(user.age)) {
            alert("Valid age is required");
            return;
        }

        if (!user.bio) {
            alert("Bio is required");
            return;
        }

        if (id) {
            //updating existing
            $.ajax({
                url: `${API_URL}/${id}`,
                type: "PUT",
                contentType: "application/json",
                data: JSON.stringify(user),
                success: function() {
                    loadUsers();
                    $("#userForm").hide();
                }
            });
        } else {
            //creating new
            $.ajax({
                url: API_URL,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(user),
                success: function() {
                    loadUsers();
                    $("#userForm").hide();
                }
            });
        }
    });


    //cancelling form
    $("#cancelBtn").click(function () {
        console.log("Save button clicked");
        $("#userForm").hide();
    });


    //loading table when web app loads
    $(document).ready(function () {
        loadUsers();
    });



</script>
</body>
</html>
